name: Track 159941 hourly

on:
  schedule:
    # 每小时 :48 触发；是否写入由脚本按 A 股交易日历 + 9:30–11:59 / 13:00–15:59 判断
    # （避免 UTC 周一–五 限制漏掉「UTC 周日 = 北京时间周一上午」）
    - cron: "48 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch quote and commit
        run: bash scripts/run_track_and_commit.sh
