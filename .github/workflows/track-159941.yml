name: Track 159941 (hourly)

on:
  schedule:
    # Every hour at :48 UTC — script skips non-trading windows (Beijing workdays 09:30–11:30, 13:00–15:00)
    - cron: "48 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-track.txt

      - name: Fetch quote and update Excel
        run: python3 scripts/track_159941.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/159941/ || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          DATE="$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
          git commit -m "chore(159941): update intraday snapshot ${DATE}"
          git push
