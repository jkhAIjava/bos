name: Track 159941 hourly

on:
  schedule:
    # 北京时间 A 股交易日：脚本用 chinese_calendar 判断工作日/调休，此处仅 cron 工作日。
    # 交易时段 9:30–11:30、13:00–15:00，按「约每小时」拉取（UTC，北京 UTC+8）：
    # - 9:48、10:48 → UTC 1:48、2:48
    # - 11:00 整点 → UTC 3:00（:48 会落在 11:30 休市后）
    # - 13:48、14:48 → UTC 5:48、6:48
    # - 15:00 收盘整点 → UTC 7:00
    - cron: "48 1,2 * * 1-5"
    - cron: "0 3 * * 1-5"
    - cron: "48 5,6 * * 1-5"
    - cron: "0 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch quote and commit
        run: bash scripts/run_track_and_commit.sh
