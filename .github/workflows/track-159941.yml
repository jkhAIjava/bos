name: Track 159941 hourly

on:
  schedule:
    # 按 UTC 触发，脚本内用 chinese_calendar + 交易时段过滤（支持中国调休补班）。
    # 北京 9:48、10:48、13:48、14:48（对应 UTC 1、2、5、6 点的 :48）
    - cron: "48 1,2,5,6 * * *"
    # 北京 11:00、15:00 整点（早盘尾盘；:48 时已过 11:30/15:00 收盘线）
    - cron: "0 3,7 * * *"
  workflow_dispatch:

concurrency:
  group: track-159941
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch quote and commit
        run: bash scripts/run_track_and_commit.sh
