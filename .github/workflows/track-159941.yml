name: Track NASDAQ100 ETF 159941

on:
  schedule:
    # 北京时间工作日每小时 :48（UTC+8 → 对应 UTC 1–3、5–7 点，周一–五）
    - cron: "48 1-3,5-7 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "忽略交易时段（测试用）"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch quote and update Excel
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            python3 scripts/track_159941.py --force
          else
            python3 scripts/track_159941.py
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/159941/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "data(159941): hourly quote snapshot $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
          git push
