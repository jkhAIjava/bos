name: Track 159941 hourly

on:
  schedule:
    # 北京时间 09:48–15:48 对应 UTC 01:48–07:48（周一–周五）
    - cron: "48 1-7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch quote and commit
        run: bash scripts/run_track_and_commit.sh
