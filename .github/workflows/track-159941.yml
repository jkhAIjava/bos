name: Track 159941 hourly

on:
  schedule:
    - cron: "48 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tracker and commit
        run: bash scripts/run_track_and_commit.sh
