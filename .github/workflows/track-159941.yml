name: Track 159941 hourly

on:
  schedule:
    # 北京时间 A 股时段（UTC+8）：工作日 9:48–14:48 每小时 :48
    - cron: "48 1-2 * * 1-5"   # 09:48、10:48
    - cron: "48 5-6 * * 1-5"   # 13:48、14:48
    # 11:00、15:00 整点（:48 会落在 11:48/15:48，已收盘，需单独触发）
    - cron: "0 3 * * 1-5"      # 11:00 北京时间 → 11:00 小时段
    - cron: "0 7 * * 1-5"      # 15:00 北京时间 → 15:00 小时段
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch quote and commit
        run: bash scripts/run_track_and_commit.sh
