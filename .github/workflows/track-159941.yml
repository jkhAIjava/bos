name: Track 159941 hourly

on:
  schedule:
    # 北京时间 9:30–11:30、13:00–15:00 ≈ UTC 01–07 点；不设 UTC 工作日，避免周一早盘落在 UTC 周日被跳过
    - cron: "48 1-7 * * *"
    # 11:00、15:00 整点（UTC 3:00、7:00）：:48 触发时已过 11:30/15:00 收盘段，单独补采
    - cron: "0 3,7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch quote and commit
        run: bash scripts/run_track_and_commit.sh
