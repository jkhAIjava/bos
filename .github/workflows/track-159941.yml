name: Track 159941 hourly

on:
  schedule:
    # 按 UTC 触发；脚本内用 chinese_calendar + 交易时段过滤（支持中国调休补班）。
    # 北京 9:30 开盘一次 + 10/11/13/14/15 整点（每个交易时段约每小时一次）
    - cron: "30 1 * * *"
    - cron: "0 2,3,5,6,7 * * *"
  workflow_dispatch:

concurrency:
  group: track-159941
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch quote and commit
        run: bash scripts/run_track_and_commit.sh
